<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Moon - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f0;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin: 4px;
    }

    .main-btn {
      background: #222;
      color: white;
      width: 100%;
    }

    .edit-btn {
      background: #e5a623;
      color: white;
    }

    .delete-btn {
      background: #d9534f;
      color: white;
    }

    .logout-btn {
      background: #555;
      color: white;
      width: 100%;
    }

    .menu-item {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .menu-item img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
    }

    #adminPanel {
      display: none;
    }

    .message {
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🌙 Harvest Moon Admin</h1>

  <!-- LOGIN -->
  <div class="box" id="loginBox">

    <h2>Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="main-btn" onclick="login()">
      Login
    </button>

    <div class="message" id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <div class="box">

      <h2>➕ Add Menu Item</h2>

      <input
        type="text"
        id="itemName"
        placeholder="Menu item name"
      >

      <input
        type="number"
        id="itemPrice"
        placeholder="Price"
      >

      <textarea
        id="itemDescription"
        placeholder="Description"
      ></textarea>

      <select id="itemCategory">
  <option value="traditional">Traditional</option>
  <option value="sweets">Sweets</option>
  <option value="kottu">Kottu & Fried Rice</option>
  <option value="pasta">Pasta & Noodles</option>
  <option value="omelets">Omelets</option>
  <option value="soups">Soups</option>
  <option value="drinks">Drinks</option>
  <option value="special">Special Drinks</option>
</select>
      
      <label>
        📷 Choose Photo
      </label>

      <input
        type="file"
        id="itemImage"
        accept="image/*"
      >

      <button class="main-btn" onclick="addItem()">
        Add Menu Item
      </button>

      <div class="message" id="addMessage"></div>

    </div>


    <div class="box">

      <h2>🍽️ Menu Items</h2>

      <div id="menuList">
        Loading...
      </div>

    </div>


    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opxgjqbwfvtvcadmkpbw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_pIrdLhe1j1cojFTfMYoBXg_i0Ea9NxJ";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


// ---------------- LOGIN ----------------

async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerText = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.innerText =
      "❌ Login failed: " + error.message;

    return;
  }

  message.innerText = "";

  showAdmin();

}


// ---------------- SHOW ADMIN ----------------

async function showAdmin() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    return;
  }

  document.getElementById("loginBox").style.display =
    "none";

  document.getElementById("adminPanel").style.display =
    "block";

  loadMenu();

}


// ---------------- ADD ITEM ----------------

async function addItem() {

  const name =
    document.getElementById("itemName").value.trim();

  const price =
    document.getElementById("itemPrice").value;

  const description =
    document.getElementById("itemDescription").value.trim();

  const category =
  document.getElementById("itemCategory").value;
  
  const imageFile =
    document.getElementById("itemImage").files[0];

  const message =
    document.getElementById("addMessage");


  if (!name || !price) {

    message.innerText =
      "❌ Name and price are required.";

    return;
  }


  message.innerText =
    "Uploading...";


  let imageUrl = "";


  // Upload image
  if (imageFile) {

    const fileExtension =
      imageFile.name.split(".").pop();

    const fileName =
      Date.now() + "-" +
      Math.random().toString(36).substring(2) +
      "." + fileExtension;


    const { error: uploadError } =
      await supabaseClient.storage
        .from("menu image")
        .upload(fileName, imageFile);


    if (uploadError) {

      message.innerText =
        "❌ Image upload failed: " +
        uploadError.message;

      return;
    }


    const { data: publicData } =
      supabaseClient.storage
        .from("menu image")
        .getPublicUrl(fileName);


    imageUrl =
      publicData.publicUrl;
  }


  // Insert menu item
  const { error } =
    await supabaseClient
.from("Menu item")
.insert({
  name: name,
  price: Number(price),
  description: description,
  image_url: imageUrl,
  category: category
});


  if (error) {

    message.innerText =
      "❌ Could not add item: " +
      error.message;

    return;
  }


  message.innerText =
    "✅ Menu item added successfully!";


  document.getElementById("itemName").value = "";
  document.getElementById("itemPrice").value = "";
  document.getElementById("itemDescription").value = "";
  document.getElementById("itemImage").value = "";


  loadMenu();

}


// ---------------- LOAD MENU ----------------

async function loadMenu() {

  const menuList =
    document.getElementById("menuList");

  menuList.innerHTML =
    "Loading...";


  const { data, error } =
    await supabaseClient
      .from("Menu item")
      .select("*")
      .order("id", { ascending: false });


  if (error) {

    menuList.innerHTML =
      "❌ Error loading menu: " +
      error.message;

    return;
  }


  if (!data || data.length === 0) {

    menuList.innerHTML =
      "<p>No menu items yet.</p>";

    return;
  }


  menuList.innerHTML = "";


  data.forEach(item => {

    const div =
      document.createElement("div");

    div.className =
      "menu-item";


    div.innerHTML = `

      ${
        item.image_url
        ? `<img src="${item.image_url}" alt="${item.name}">`
        : ""
      }

      <h3>${escapeHtml(item.name)}</h3>

      <div class="price">
        Rs. ${Number(item.price).toFixed(2)}
      </div>

      <p>
        ${escapeHtml(item.description || "")}
      </p>

      <button
        class="edit-btn"
        onclick="editItem(${item.id})">
        ✏️ Edit
      </button>

      <button
        class="delete-btn"
        onclick="deleteItem(${item.id})">
        🗑️ Delete
      </button>

    `;


    menuList.appendChild(div);

  });

}


// ---------------- EDIT ITEM ----------------

async function editItem(id) {

  const newName =
    prompt("Enter new menu item name:");

  if (newName === null) {
    return;
  }


  const newPrice =
    prompt("Enter new price:");

  if (newPrice === null) {
    return;
  }


  const newDescription =
    prompt("Enter new description:");

  if (newDescription === null) {
    return;
  }

  
  const image_url =
    prompt("Enter imageurl:");

  if (imageurl === null) {
    return;
  }

  
  const { error } =
    await supabaseClient
      .from("Menu item")
      .update({
        name: newName,
        price: Number(newPrice),
        description: newDescription,
        image_url: imageurl
      })
    
      .eq("id", id);
  
  if (error) {

    alert(
      "❌ Update failed: " +
      error.message
    );

    return;
  }


  alert("✅ Menu item updated!");

  loadMenu();

}


// ---------------- DELETE ITEM ----------------

async function deleteItem(id) {

  const confirmDelete =
    confirm(
      "Are you sure you want to delete this menu item?"
    );

  if (!confirmDelete) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("Menu item")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "❌ Delete failed: " +
      error.message
    );

    return;
  }


  alert("✅ Menu item deleted!");

  loadMenu();

}


// ---------------- LOGOUT ----------------

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


// ---------------- SECURITY ----------------

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;
}


// Check existing login
supabaseClient.auth.getSession()
  .then(({ data }) => {

    if (data.session) {
      showAdmin();
    }

  });

</script>
</body>
</html>
